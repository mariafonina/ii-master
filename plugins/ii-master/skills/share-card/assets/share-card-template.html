<!doctype html>
<!--
  ИИ-мастер — карточка результата для соцсетей. Самодостаточный файл: без сети, без внешних ресурсов.

  Как пользоваться (скилл share-card делает это сам):
    1. В скрипте ниже строка  const DATA = <маркер>{…}<маркер>;  где маркер — комментарий из слова DATA в звёздочках.
       Всё между двумя маркерами (включая их) заменить на  маркер + JSON из ~/.claude/ii-master-result.json + маркер.
       Проще: запустить scripts/inline_data.py — он сам добавит в JSON поля подвала (контракт 5:
       footer_handle, footer_link — из config.md ядра; опционально footer_test) и сохранит готовый файл.
       Без этих полей карточка выйдет с подвалом «тест «ИИ-мастер» в Claude Code», без хэндла, ссылки и QR.
       (КОНТРАКТ 2: version, mode, date, name, dialogs_n, score11, habits, strong, growth; лишние поля игнорируются).
    2. Открыть файл как  …/ii-master-card.html?variant=story   (540×960)  или  ?variant=square  (540×540).
       Дополнительно: &theme=light — светлая тема (основная — тёмная); &shot=1 — режим скриншота (скрыть кнопку, без прокрутки).
    3. PNG: headless Chromium со --window-size=540,960 (или 540,540) и --force-device-scale-factor=2 → 1080×1920 / 1080×1080,
       либо кнопка «Скачать PNG» внизу страницы (Canvas, рендер @2x — работает и в Safari).

  Вёрстка карточки — обычный HTML/CSS (размер ровно 540×960 / 540×540, сейф-зоны сторис 125px сверху и 170px снизу
  в этом масштабе). Кнопка рисует тот же DOM на canvas по геометрии элементов (без html2canvas), поэтому PNG с кнопки
  совпадает с headless-скриншотом.

  Шрифты: Bitter 700, Golos Text 400–600 (переменный), JetBrains Mono 600 — сабсеты cyrillic+latin с Google Fonts,
  встроены base64 (блок между двумя маркерами FONTS в <style>, собирается scripts/build_assets.py). Все три — SIL Open Font License 1.1,
  встраивание и распространение в составе документа разрешены; имена и лицензия сохраняются в этом комментарии.
  Если блок шрифтов пуст (сборка без сети) — работает системный стек: Georgia / Helvetica Neue, Arial / Menlo, Consolas.
  QR (только square) — base64 PNG, собирается той же сборкой библиотекой python-qrcode; пустая строка = без QR.
-->

/*FONTS*/

:root{
  /* тёмная тема — основная (токены из дизайн-системы fluency-index) */
  --ground:#0E1211; --surface:#161C1A; --ink:#E6EDEA; --ink-2:#98A3A0; --ink-3:#6E7A77;
  --rule:#253130; --track:#222B29;
  --accent:#4FC0AB; --accent-ghost:#1F4C45; --warn:#D9836A; --warn-ghost:#4A2E26; --tick:#C7D2CF;
}
:root[data-theme="light"]{
  --ground:#F1F3F1; --surface:#FFFFFF; --ink:#141A18; --ink-2:#5C6664; --ink-3:#8A9491;
  --rule:#DBE0DD; --track:#E4E8E5;
  --accent:#0D6E60; --accent-ghost:#B7D6CF; --warn:#A9503A; --warn-ghost:#E2C3B8; --tick:#2C3634;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground)}
html.shot{overflow:hidden}
body{
  display:flex; flex-direction:column; align-items:center;
  color:var(--ink);
  font-family:"Golos Text","Helvetica Neue",Arial,sans-serif; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
}
.serif{font-family:"Bitter",Georgia,"Times New Roman",serif}
.mono{font-family:"JetBrains Mono",Menlo,Consolas,"Courier New",monospace}

/* ---------- карточка ---------- */
.card{
  position:relative; flex:none; overflow:hidden;
  width:540px; height:960px; padding:140px 44px 186px;
  background:var(--ground); color:var(--ink);
  display:flex; flex-direction:column;
}
.eyebrow{
  display:flex; align-items:center; gap:10px;
  font-family:"JetBrains Mono",Menlo,Consolas,"Courier New",monospace; font-size:11px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); line-height:1;
}
.badge{
  display:inline-block; padding:6px 9px 5px; border:1px solid var(--accent); border-radius:3px;
  color:var(--accent); line-height:1; white-space:nowrap;
}
.name{
  margin-top:22px;
  font-family:"Bitter",Georgia,"Times New Roman",serif; font-weight:700; font-size:34px; line-height:1.15;
  letter-spacing:-.01em; white-space:nowrap; color:var(--ink);
}
.hero{margin-top:18px}
.big{display:flex; align-items:baseline; gap:10px; line-height:1; font-family:"Bitter",Georgia,"Times New Roman",serif; font-weight:700}
.big .n{font-size:164px; letter-spacing:-.04em; color:var(--ink); font-variant-numeric:tabular-nums; line-height:.9}
.big .of{font-size:48px; color:var(--ink-3); letter-spacing:-.02em}
.cap{margin-top:10px; font-size:19px; line-height:1.3; color:var(--ink-2)}
.segs{display:flex; gap:4px; margin-top:24px; height:16px}
.segs i{flex:1 1 0; background:var(--track); border-radius:2px}
.segs i.on{background:var(--accent)}
.segline{margin-top:8px; font-family:"JetBrains Mono",Menlo,Consolas,"Courier New",monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); line-height:1.4}
.segline b{color:var(--ink-2); font-weight:600}

.lists{margin-top:30px; display:flex; flex-direction:column; gap:22px}
.lbl{
  font-family:"JetBrains Mono",Menlo,Consolas,"Courier New",monospace; font-size:11px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); line-height:1; margin-bottom:10px;
}
ul.strong{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
ul.strong li{display:flex; align-items:center; gap:10px; font-size:18px; line-height:1.3; color:var(--ink)}
ul.strong li i{flex:none; width:9px; height:9px; border-radius:2px; background:var(--accent)}
.nx{font-family:"Bitter",Georgia,"Times New Roman",serif; font-weight:700; font-size:23px; line-height:1.25; color:var(--accent); letter-spacing:-.01em}
.nx.done{color:var(--ink)}

.foot{margin-top:auto; padding-top:18px; border-top:1px solid var(--rule); position:relative}
.base{font-size:13.5px; line-height:1.45; color:var(--ink-2)}
.sig{margin-top:10px; font-family:"JetBrains Mono",Menlo,Consolas,"Courier New",monospace; font-size:11px; letter-spacing:.04em; color:var(--ink-3); line-height:1.5}
.sig b{color:var(--ink-2); font-weight:600}
.qr{display:none}

/* ---------- квадрат ---------- */
.square .card{width:540px; height:540px; padding:40px 40px 36px}
.square .name{margin-top:14px; font-size:26px}
.square .hero{margin-top:8px}
.square .big .n{font-size:104px}
.square .big .of{font-size:34px}
.square .cap{margin-top:4px; font-size:16px}
.square .segs{margin-top:14px; height:12px}
.square .segline{display:none}
.square .lists{margin-top:18px; gap:12px}
.square .lbl{margin-bottom:5px; font-size:10.5px}
.square ul.strong{flex-direction:row; flex-wrap:wrap; gap:4px 14px}
.square ul.strong li{font-size:15.5px}
.square ul.strong li i{width:8px; height:8px}
.square .nx{font-size:19px}
.square .foot{padding-top:12px; padding-right:122px; min-height:105px}
.square .base{font-size:12px}
.square .sig{margin-top:6px; font-size:10px}
.square .qr{display:block; position:absolute; right:0; bottom:0; width:105px; height:105px; image-rendering:pixelated}
.square .qr.none{display:none}

/* ---------- кнопка под карточкой (в скриншот не попадает) ---------- */
.ui{
  width:540px; max-width:100%; padding:18px 0 40px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  font-size:14px; line-height:1.45; color:var(--ink-2);
}
.ui button{
  font:600 15px/1 "Golos Text","Helvetica Neue",Arial,sans-serif; color:var(--ground); background:var(--accent);
  border:0; border-radius:4px; padding:12px 18px; cursor:pointer;
}
.ui button:disabled{opacity:.6; cursor:default}
.ui a{color:var(--accent)}
html.shot .ui{display:none}
@media print{.ui{display:none}}
</style>
</head>

      <div class="lbl">Сильное</div>
      <ul class="strong" id="strong"></ul>
    </div>
    <div class="blk" id="nextBlk">
      <div class="lbl" id="nextLbl">Следующая привычка</div>
      <div class="nx" id="next"></div>
    </div>
  </div>

  <div class="foot">
    <div class="base" id="base">Средний пользователь — 3–4 из 11. По шкале из исследования Anthropic.</div>
    <div class="sig" id="sig"></div>
    <img class="qr none" id="qr" alt="">
  </div>
</div>

<div class="ui" id="ui">
  <button id="dl" type="button">Скачать PNG</button>
  <span id="hint">1080×1920 для сторис. Квадрат для чатов — <a id="altlink" href="?variant=square">открыть квадрат</a>.</span>
</div>

<script>
// ======== ДАННЫЕ (контракт 2). Скилл заменяет всё между двумя маркерами DATA (вместе с маркерами) на маркер + JSON + маркер ========
const DATA = /*DATA*/{"version":1,"mode":"quiz","date":"2026-08-23","name":"Мари","dialogs_n":null,"score11":7,"composite_pct":null,
  "habits":{"iter":1,"goal":1,"examples":0,"format":1,"mode":0,"tone":1,"context":1,"audience":1,"reason":0,"approach":0,"fact":1},
  "habit_rates":null,"strong":["goal","context","iter"],"growth":["examples"],
  "features_unused":["schedule","plugins","slash-commands"],"features_used":["skills"],
  "footer_handle":"@mariafonina","footer_link":"https://labsme.ru/ai"}/*DATA*/;

/* QR на квадрат (base64 PNG) и адрес, который в нём закодирован, — собирает scripts/build_assets.py
   из config.md ядра; пустые строки — без QR. QR показывается, только если он соответствует footer_link. */
const QR_DATA = /*QR*/"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAANIAAADSAQAAAAAX4qPvAAABwUlEQVR4nO2YXWrkMBCEq92CPEo3yFFkyAH2SINvZh1lDhCQHgMStbSUgQTy8xB2tzdED2bsZpiPcqlaPUK8t8r2bgn4qf33tSIikgoAEQEw7F78cYJkRx6pKIm2I5I8HXKOqZ5WPKUS4mEKp3/F8mmtBGS0y1N6o/bR9/5SLby80ZpCzONP/t72hZrSQrQDiCevO5BZPXKKSABGKiNh3B9oIrI74wSf14nI/vrJ5iw/gTKmgDr5xOS1OPXEiRmVmTVzulR53lT1pieUhzkzlRmhhuo05xPueAAGGZCHXELzuI8QiWgCsmblqXXZ4HTnz0hWrMycvd6WP05O1NNsOWXsK/DdcZ597ncle1wpmk1ef5w69VwaqhHSnz/DM21LbEkfd9xzBOijw5wna0ak1qw1d1OV8+pKT0wqQ7U3XvM83WWf/sTNnKzWjDC7pz/Otex1r5MnJ6Qzzu02byK0vQNijR4+5yPOebPHQ6slvFbwenHGGewcEtBRHjok1nA1KbUfzji324fc296bdGugXC3e57w5ErT+QruYSwF6nTfv7IB3BNtWuxnVH6fMgWiYMTPimjuyM075+f/zzfXda78Bju460WBgrBQAAAAASUVORK5CYII="/*QR*/;
const QR_URL = /*QRURL*/"https://labsme.ru/ai?utm_source=share_card"/*QRURL*/;

/* КОНТРАКТ 1 — 11 слагов, порядок фиксирован. [слаг, короткое имя, строка из шпаргалки] */
const HABITS = [
  ["iter",     "Итерация",        "Итерация: правило третьего хода"],
  ["goal",     "Цель",            "Цель: скажи, зачем"],
  ["examples", "Образец",         "Образец: покажи «как надо»"],
  ["format",   "Формат",          "Формат: назови, в каком виде"],
  ["mode",     "Роль и правила",  "Роль и правила: назначь, как работать"],
  ["tone",     "Тон",             "Тон: скажи, каким голосом"],
  ["context",  "Контекст",        "Контекст: дай то, чего модель не знает"],
  ["audience", "Адресат",         "Адресат: скажи, для кого"],
  ["reason",   "Спор с логикой",  "Спор с логикой: «откуда ты это взял?»"],
  ["approach", "Совет до старта", "Совет до старта: «как бы ты подошёл?»"],
  ["fact",     "Проверка фактов", "Факты: проверь руками цифры и названия"]
];
const SHORT = Object.fromEntries(HABITS.map(h => [h[0], h[1]]));
const LONG  = Object.fromEntries(HABITS.map(h => [h[0], h[2]]));

const qs = new URLSearchParams(location.search);
const VARIANT = qs.get("variant") === "square" ? "square" : "story";
if (qs.get("theme") === "light") document.documentElement.setAttribute("data-theme", "light");
if (qs.get("shot") === "1") document.documentElement.classList.add("shot");
document.body.classList.add(VARIANT);

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function fmtDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
  if (!m) return String(s || "");
  return `${m[3]}.${m[2]}.${m[1]}`;
}
function esc(t){
  return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function sameTarget(a, b){
  const norm = u => String(u || "").replace(/^https?:\/\//, "").split(/[?#]/)[0].replace(/\/$/, "").toLowerCase();
  const na = norm(a), nb = norm(b);
  return !!na && !!nb && na === nb;
}
function clampScore(v){
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? Math.max(0, Math.min(11, n)) : 0;
}

function fill(){
  const d = DATA || {};
  const score = clampScore(d.score11);
  const habits = d.habits || {};

  // бейдж метода + дата
  let badge = "экспресс-тест";
  if (d.mode === "auto") {
    const n = Number(d.dialogs_n);
    badge = Number.isFinite(n) && n > 0 ? `по реальной истории · ${n} ${plural(n, "диалог", "диалога", "диалогов")}` : "по реальной истории";
  }
  document.getElementById("badge").textContent = badge;
  document.getElementById("date").textContent = fmtDate(d.date);

  // имя (null → строка скрыта); длинное — ужимаем, потом режем
  const nameEl = document.getElementById("name");
  const name = (d.name == null) ? "" : String(d.name).trim();
  if (!name) nameEl.style.display = "none";
  else {
    nameEl.textContent = name;
    fitOneLine(nameEl, VARIANT === "square" ? 18 : 22);
  }

  // балл; в авто-режиме это среднее на диалог — подпись честно об этом говорит
  document.getElementById("score").textContent = String(score);
  if (d.mode === "auto") document.querySelector(".cap").innerHTML = "привычек уверенной работы с&nbsp;ИИ — в&nbsp;среднем на&nbsp;диалог";

  // полоса из 11 сегментов в порядке контракта
  const segs = document.getElementById("segs");
  segs.innerHTML = "";
  let on = 0;
  for (const [slug] of HABITS) {
    const i = document.createElement("i");
    if (Number(habits[slug]) === 1) { i.className = "on"; on++; }
    segs.appendChild(i);
  }
  const segline = document.getElementById("segline");
  const segNames = "слева направо: итерация, цель, образец, формат, роль, тон, контекст, адресат, спор, совет, факты";
  segline.innerHTML = (DATA && DATA.mode === "auto")
    ? `<b>выше базы Anthropic: ${on} из 11</b> · ${segNames}`
    : `<b>${on} из 11</b> · ${segNames}`;

  // сильное — до 3 коротких имён
  const strong = (Array.isArray(d.strong) ? d.strong : []).filter(s => SHORT[s]).slice(0, 3);
  const strongUl = document.getElementById("strong");
  strongUl.innerHTML = "";
  if (strong.length) {
    for (const s of strong) {
      const li = document.createElement("li");
      li.innerHTML = `<i></i><span>${SHORT[s]}</span>`;
      strongUl.appendChild(li);
    }
  } else {
    document.getElementById("strongBlk").style.display = "none";
  }

  // следующая привычка — первая из growth; при 11/11 — спокойная строка
  const growth = (Array.isArray(d.growth) ? d.growth : []).filter(s => LONG[s]);
  const next = document.getElementById("next");
  if (growth.length) next.textContent = LONG[growth[0]];
  else {
    document.getElementById("nextLbl").textContent = "Следующий шаг";
    next.textContent = score >= 11 ? "Все одиннадцать уже в работе" : "Удержать то, что уже есть";
    next.classList.add("done");
  }

  // подвал — из result.json (контракт 5: footer_handle, footer_link; footer_test — опционально)
  const linkShown = String(d.footer_link || "").replace(/^https?:\/\//, "").replace(/\/$/, "");
  const segs2 = [];
  if (d.footer_handle) segs2.push(`<b>${esc(d.footer_handle)}</b>`);
  segs2.push(`тест «${esc(d.footer_test || "ИИ-мастер")}» в Claude Code`);
  if (linkShown) segs2.push(`<b>${esc(linkShown)}</b>`);
  document.getElementById("sig").innerHTML = segs2.join(" · ");

  // QR — только квадрат и только если закодированный адрес соответствует footer_link
  const qr = document.getElementById("qr");
  if (VARIANT === "square" && QR_DATA && sameTarget(d.footer_link, QR_URL)) {
    qr.onload = () => { const w = qr.naturalWidth / 2; qr.style.width = w + "px"; qr.style.height = w + "px"; };
    qr.src = QR_DATA; qr.classList.remove("none");
  }

  // подсказка под карточкой
  const hint = document.getElementById("hint");
  const alt = document.getElementById("altlink");
  const keep = [];
  if (qs.get("theme")) keep.push("theme=" + encodeURIComponent(qs.get("theme")));
  const tail = keep.length ? "&" + keep.join("&") : "";
  if (VARIANT === "square") {
    hint.firstChild.textContent = "1080×1080 для чатов и постов. Вертикальная для сторис — ";
    alt.textContent = "открыть сторис"; alt.href = "?variant=story" + tail;
  } else {
    alt.href = "?variant=square" + tail;
  }
}

function fitOneLine(el, minPx){
  const cs = getComputedStyle(el);
  let size = parseFloat(cs.fontSize);
  el.style.fontSize = "";
  const max = el.clientWidth;
  while (el.scrollWidth > max && size > minPx) { size -= 1; el.style.fontSize = size + "px"; }
  if (el.scrollWidth > max) {
    let t = el.textContent;
    while (t.length > 3 && el.scrollWidth > max) { t = t.slice(0, -2).trimEnd(); el.textContent = t + "…"; }
  }
}

/* ======== кнопка «Скачать PNG»: DOM → canvas по геометрии элементов, @2x ======== */
function roundRectPath(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function isTransparent(c){ return !c || c === "transparent" || /rgba\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*0\s*\)/.test(c); }

function paintCard(ctx, card){
  const base = card.getBoundingClientRect();
  const cs0 = getComputedStyle(card);
  ctx.fillStyle = cs0.backgroundColor;
  ctx.fillRect(0, 0, base.width, base.height);

  const walker = document.createTreeWalker(card, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null);
  let node;
  while ((node = walker.nextNode())) {
    if (node.nodeType === 1) {
      if (node === card) continue;
      const cs = getComputedStyle(node);
      if (cs.display === "none" || cs.visibility === "hidden") { continue; }
      const r = node.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      const x = r.left - base.left, y = r.top - base.top;
      const rad = parseFloat(cs.borderTopLeftRadius) || 0;
      if (!isTransparent(cs.backgroundColor) && node.tagName !== "IMG") {
        ctx.fillStyle = cs.backgroundColor;
        roundRectPath(ctx, x, y, r.width, r.height, rad); ctx.fill();
      }
      const bw = parseFloat(cs.borderTopWidth) || 0;
      if (bw > 0 && cs.borderTopStyle !== "none" && !isTransparent(cs.borderTopColor)) {
        const allSides = (parseFloat(cs.borderBottomWidth) || 0) > 0 && (parseFloat(cs.borderLeftWidth) || 0) > 0;
        ctx.strokeStyle = cs.borderTopColor; ctx.lineWidth = bw;
        if (allSides) { roundRectPath(ctx, x + bw / 2, y + bw / 2, r.width - bw, r.height - bw, Math.max(0, rad - bw / 2)); ctx.stroke(); }
        else { ctx.beginPath(); ctx.moveTo(x, y + bw / 2); ctx.lineTo(x + r.width, y + bw / 2); ctx.stroke(); }
      }
      if (node.tagName === "IMG" && node.complete && node.naturalWidth) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(node, x, y, r.width, r.height);
        ctx.imageSmoothingEnabled = true;
      }
    } else if (node.nodeType === 3) {
      const text = node.nodeValue;
      if (!text || !text.trim()) continue;
      const el = node.parentElement;
      const cs = getComputedStyle(el);
      if (cs.display === "none" || cs.visibility === "hidden") continue;
      const font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      ctx.font = font; ctx.fillStyle = cs.color; ctx.textBaseline = "alphabetic";
      const m = ctx.measureText("Hg");
      const asc = m.fontBoundingBoxAscent || parseFloat(cs.fontSize) * 0.9;
      const desc = m.fontBoundingBoxDescent || parseFloat(cs.fontSize) * 0.25;
      const upper = cs.textTransform === "uppercase";
      const range = document.createRange();
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === " " || ch === "\n" || ch === "\t" || ch === " ") continue;
        range.setStart(node, i); range.setEnd(node, i + 1);
        const rects = range.getClientRects();
        if (!rects.length) continue;
        const cr = rects[0];
        if (!cr.width && !cr.height) continue;
        const baseline = cr.top - base.top + (cr.height - (asc + desc)) / 2 + asc;
        ctx.fillText(upper ? ch.toUpperCase() : ch, cr.left - base.left, baseline);
      }
    }
  }
}

async function download(){
  const btn = document.getElementById("dl");
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Готовлю…";
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const card = document.getElementById("card");
    const r = card.getBoundingClientRect();
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(r.width * scale); canvas.height = Math.round(r.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    paintCard(ctx, card);
    const fname = VARIANT === "square" ? "ii-master-square.png" : "ii-master-story.png";
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    if (!blob) throw new Error("toBlob → null");
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    btn.textContent = "Готово · " + fname;
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  } catch (e) {
    btn.textContent = "Не вышло — сделай скриншот карточки";
    console.error(e);
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 4000);
  }
}

fill();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  const n = document.getElementById("name");
  if (n.style.display !== "none") { n.style.fontSize = ""; fitOneLine(n, VARIANT === "square" ? 18 : 22); }
});
document.getElementById("dl").addEventListener("click", download);
</script>
